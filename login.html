<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artizan - Login</title>

  
  
  <!-- link with css file -->

  <link rel="stylesheet" type="text/css" href="style.css">

 
  <style type="text/css">
    .banner {
      background-image: url(pottery.jpg);
    }
  </style>

   <!--  java script file -->
    <script src="script.js"></script>


</head>
<body>

   <!-- header -->
  <header>
    <div class="content">
      <div class="logo">

        <!-- logo goes to about us -->

        <a href="about.html">
          <img src="logo.png" alt="Artizan logo" width="150" height="109">
        </a>
      </div>

      <nav class="menu">
        <ul>
          <li><a href="home.html">Home</a></li>
          <li>
            <a href="about.html">About Us</a>
            <ul>
              <li><a href="about.html#story">Our Story</a></li>
              <li><a href="about.html#goals">Our Goals</a></li>
              <li><a href="about.html#team">Our Team</a></li>
            </ul>
          </li>
          <li><a href="login.html">Login</a></li>
          <li><a href="signup.html">Sign Up</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- photo -->
  <div class="banner" id="top" onclick="changeLoginBanner()">
    <div class="layer"></div>
    <div class="content banner-text">
      <h1 id="bannerTitle">Welcome Back</h1>
      <p id="bannerLine">Log in to your Artizan account.</p>
    </div>
  </div>

  <!-- form -->
  <section class="box form-box">
    <h2 class="center">Log In</h2>

    <form name="loginForm" method="post" action="#" onsubmit="return validateLogin()">
      <p>
        <label>Email:<br>
          <input type="email" name="email" placeholder="name@example.com" size="40" autofocus >
        </label>
      </p>
      <p>
        <label>Password:<br>
          <input type="password" name="password" size="40" >
        </label>
      </p>
      <p>
        <input type="checkbox" name="remember" value="yes">
        <label>Remember me</label>
      </p>
      <p>
        <input type="submit" value="Log In" class="button">
        <input type="reset" value="Clear" class="button">
      </p>
    </form>

    <p class="center">New to Artizan? <a href="signup.html">Create an account</a></p>
  </section>

  <!-- footer -->
  <footer>
    <h3>Artizan</h3>
    <p>
      <a href="home.html">Home</a> |
      <a href="about.html">About Us</a> |
      <a href="login.html">Login</a> |
      <a href="signup.html">Sign Up</a>
    </p>
    <p>&copy; 2026 Artizan - All rights reserved | <a href="#top">Back to top</a></p>
  </footer>

 
 
</body>


</html>
